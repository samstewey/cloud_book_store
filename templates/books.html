<html>
  <head>
    <title>Book Store</title>
    <!-- <link rel="stylesheet" href="https://cdn.simplecss.org/simple.css"> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-[#060717]">
    <main>
      <h1  class="text-5xl flex text-white justify-center py-5">Books</h1>
      <ul class="py-5">
        {% for book in books %}
          <li class="flex text-white justify-center">{{book.title}} by {{book.author}}</li>
        {% endfor %}
      </ul>
      <form class="text-white flex justify-center py-10 gap-4" method="POST" action="/books">
        <label for="title">Title:</label>
        <input type="text" name="title" placeholder="Title" class="bg-white text-black rounded">

        <label for="author">Author:</label>
        <input type="text" name="author" placeholder="Author" class="bg-white text-black rounded">
        <input type="submit" value="Submit" class="bg-cyan-500 hover:bg-blue-700 text-white font-bold  px-4 rounded">
      </form>
    </main>
  </body>
</html>
