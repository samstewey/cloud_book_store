<html>
    <head>
        <title>Book Store</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="bg-[#060717]">
        <main>
            <form class="text-white flex justify-center py-10 gap-4" method="POST" action="/users/new">
                <label for="password">Username:</label>
                <input type="text" name="username" placeholder="Password" class="bg-white text-black rounded">
                <label for="password">Password:</label>
                <input type="password" name="password" placeholder="Password" class="bg-white text-black rounded">
                <input type="submit" value="Submit">
            </form>
        </main>
    </body>
</html>
